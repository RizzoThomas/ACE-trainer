[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetry"
version = "0.1.0"
description = "Shared memory reader for Assetto Corsa, ACC, and AC Evo telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Assetto Telemetry Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: System :: Hardware",
]
dependencies = [
    # Core runtime dependencies (none, pure stdlib)
]

[project.optional-dependencies]
# Development and testing dependencies
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
]
# GUI dependencies for the telemetry dashboard
gui = [
    "PyQt6>=6.10.0",
]

# Note: To run the GUI, use:
#   python src/gui/main_window.py --mock
# or after installing with pip install -e ".[gui]":
#   python -m telemetry.gui.main_window --mock

[tool.hatch.build.targets.wheel]
packages = ["telemetry"]
src = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
